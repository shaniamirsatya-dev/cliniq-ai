<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מטופלים — CliniqAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-text">✦ CliniqAI</div>
        <div class="logo-sub">ניהול קליניקה חכם</div>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">טוען...</div>
          <div class="sidebar-user-role" id="sidebar-user-role">מטפל/ת</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="nav-icon">🏠</span> לוח בקרה</a>
        <a href="/calendar.html"><span class="nav-icon">📅</span> יומן</a>
        <a href="/patients.html" class="active"><span class="nav-icon">👥</span> מטופלים</a>
        <a href="#" onclick="showToast('בקרוב!','info')"><span class="nav-icon">💬</span> הודעות</a>
        <a href="#" onclick="showToast('בקרוב!','info')"><span class="nav-icon">📊</span> דוחות</a>
        <a href="/settings.html"><span class="nav-icon">⚙️</span> הגדרות</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn"><span>🚪</span> התנתקות</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">👥 מטופלים</h1>
          <p class="page-subtitle" id="patients-count">טוען...</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('modal-new-patient')">+ מטופל חדש</button>
      </div>

      <!-- Search & Filter -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap">
        <div class="search-bar" style="flex:1;min-width:200px;max-width:400px">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="חיפוש לפי שם או טלפון...">
        </div>
        <div class="filter-pills">
          <button class="filter-pill active" data-filter="all">כל המטופלים</button>
          <button class="filter-pill" data-filter="active">פעילים</button>
          <button class="filter-pill" data-filter="archived">ארכיון</button>
        </div>
      </div>

      <!-- Patients Table -->
      <div class="card" style="padding:0">
        <div class="table-wrapper">
          <table id="patients-table">
            <thead>
              <tr>
                <th onclick="sortBy('full_name')">מטופל ↕</th>
                <th onclick="sortBy('phone')">טלפון ↕</th>
                <th onclick="sortBy('treatment_type')">סוג טיפול ↕</th>
                <th onclick="sortBy('created_at')">תאריך הצטרפות ↕</th>
                <th>טיפולים</th>
                <th onclick="sortBy('status')">סטטוס ↕</th>
                <th>פעולות</th>
              </tr>
            </thead>
            <tbody id="patients-tbody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">
                <div class="skeleton" style="height:14px;margin-bottom:8px;width:60%;margin:0 auto 8px"></div>
                <div class="skeleton" style="height:14px;width:40%;margin:0 auto"></div>
              </td></tr>
            </tbody>
          </table>
        </div>
        <!-- Mobile cards (hidden on desktop, shown on mobile via CSS) -->
        <div class="mobile-cards" id="patients-mobile-cards"></div>
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/dashboard.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">🏠</span>
      <span class="bottom-nav-label">בית</span>
    </a>
    <a href="/calendar.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">📅</span>
      <span class="bottom-nav-label">יומן</span>
    </a>
    <a href="/patients.html" class="bottom-nav-item active">
      <span class="bottom-nav-icon">👥</span>
      <span class="bottom-nav-label">מטופלים</span>
    </a>
    <a href="/settings.html" class="bottom-nav-item">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">הגדרות</span>
    </a>
  </nav>

  <!-- FAB -->
  <button class="fab" onclick="openModal('modal-new-patient')" title="מטופל חדש">+</button>

  <!-- New Patient Modal -->
  <div class="modal-overlay" id="modal-new-patient" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">👤 מטופל חדש</h2>
        <button class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="grid grid-2">
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">שם מלא *</label>
            <input type="text" class="form-input" id="p-name" placeholder="שם פרטי ומשפחה" required>
          </div>
          <div class="form-group">
            <label class="form-label">טלפון</label>
            <input type="tel" class="form-input" id="p-phone" placeholder="050-0000000">
          </div>
          <div class="form-group">
            <label class="form-label">אימייל</label>
            <input type="email" class="form-input" id="p-email" placeholder="email@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">תאריך לידה</label>
            <input type="date" class="form-input" id="p-birth">
          </div>
          <div class="form-group">
            <label class="form-label">סוג טיפול עיקרי</label>
            <input type="text" class="form-input" id="p-treatment" list="treatment-types" placeholder="הקלידי או בחרי...">
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label class="form-label">הערות כלליות</label>
            <textarea class="form-input" id="p-notes" placeholder="מידע רלוונטי, רקע, הפניות..." style="min-height:80px"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="save-patient-btn">שמירה</button>
        <button class="btn btn-ghost" onclick="closeModal('modal-new-patient')">ביטול</button>
      </div>
    </div>
  </div>

  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let therapistId = null;
    let allPatients = [];
    let filtered = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let sortCol = 'created_at';
    let sortAsc = false;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      initLogout(); initMobileSidebar(); initModals();
      const profile = await ensureTherapistProfile(user);
      therapistId = profile?.id;
      await loadSidebarUser();

      setupSearch();
      setupFilters();
      setupSave();

      if (therapistId) await loadPatients();
    }

    async function loadPatients() {
      allPatients = await getPatients(therapistId);
      applyFilters();
    }

    function setupSearch() {
      document.getElementById('search-input').addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        applyFilters();
      });
    }

    function setupFilters() {
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentFilter = pill.dataset.filter;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      filtered = allPatients.filter(p => {
        const matchFilter = currentFilter === 'all' || p.status === currentFilter;
        const matchSearch = !currentSearch ||
          p.full_name?.toLowerCase().includes(currentSearch) ||
          p.phone?.includes(currentSearch) ||
          p.email?.toLowerCase().includes(currentSearch);
        return matchFilter && matchSearch;
      });
      filtered.sort((a, b) => {
        const av = a[sortCol] || ''; const bv = b[sortCol] || '';
        return sortAsc ? av.localeCompare(bv, 'he') : bv.localeCompare(av, 'he');
      });
      renderTable();
    }

    function sortBy(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      applyFilters();
    }

    function renderTable() {
      const tbody = document.getElementById('patients-tbody');
      document.getElementById('patients-count').textContent = `${filtered.length} מטופלים`;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7">
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <h3>אין מטופלים</h3>
            <p>לחצי על "+ מטופל חדש" להוספה</p>
          </div>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(p => {
        const age = calcAge(p.birth_date);
        const pid = escapeHTML(p.id);
        const archiveLabel = p.status === 'active' ? 'ארכיון' : 'שחזר';
        return `<tr data-pid="${pid}" style="cursor:pointer">
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <div class="avatar" style="background:${avatarColor(p.full_name)}">${initials(p.full_name)}</div>
              <div>
                <div class="p-name" style="font-weight:600"></div>
                ${age ? `<div style="font-size:0.72rem;color:var(--text-muted)">בן/ת ${age}</div>` : ''}
              </div>
            </div>
          </td>
          <td class="p-phone" style="color:var(--text-secondary)"></td>
          <td class="p-type" style="color:var(--text-secondary)"></td>
          <td style="color:var(--text-secondary)">${formatDate(p.created_at, {day:'numeric',month:'short',year:'numeric'})}</td>
          <td><span style="font-weight:600;color:var(--primary)">—</span></td>
          <td>${statusBadge(p.status)}</td>
          <td>
            <div style="display:flex;gap:6px;align-items:center">
              <button class="btn btn-ghost btn-sm btn-profile" data-pid="${pid}">פרופיל</button>
              <button class="btn btn-primary btn-sm btn-schedule" data-pid="${pid}">תור</button>
              <button class="btn-whatsapp btn-sm btn-wa" data-phone="${escapeHTML(p.phone || '')}">💬</button>
              <button class="btn btn-ghost btn-sm btn-archive" data-pid="${pid}" data-status="${escapeHTML(p.status)}">${archiveLabel}</button>
            </div>
          </td>
        </tr>`;
      }).join('');

      // Set free-text via textContent, wire events without inline onclick
      tbody.querySelectorAll('tr[data-pid]').forEach((row, i) => {
        const p = filtered[i];
        row.querySelector('.p-name').textContent = p.full_name;
        row.querySelector('.p-phone').textContent = p.phone || '—';
        row.querySelector('.p-type').textContent = p.treatment_type || '—';
        row.addEventListener('click', (e) => { if (e.target.closest('button')) return; window.location.href = `/patient.html?id=${p.id}`; });
      });
      tbody.querySelectorAll('.btn-profile').forEach(btn => btn.addEventListener('click', () => { window.location.href = `/patient.html?id=${btn.dataset.pid}`; }));
      tbody.querySelectorAll('.btn-schedule').forEach(btn => btn.addEventListener('click', () => { window.location.href = '/calendar.html'; }));
      tbody.querySelectorAll('.btn-wa').forEach(btn => btn.addEventListener('click', () => openWhatsApp(btn.dataset.phone)));
      tbody.querySelectorAll('.btn-archive').forEach(btn => btn.addEventListener('click', () => archivePatient(btn.dataset.pid, btn.dataset.status)));

      renderMobileCards();
    }

    function renderMobileCards() {
      const container = document.getElementById('patients-mobile-cards');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="empty-state-icon">👥</div><h3>אין מטופלים</h3><p>לחצי על + להוספה</p>';
        container.appendChild(empty);
        return;
      }

      container.innerHTML = '';
      filtered.forEach(p => {
        const age = calcAge(p.birth_date);
        const card = document.createElement('div');
        card.className = 'patient-mobile-card';
        card.innerHTML = `
          <div class="avatar" style="background:${avatarColor(p.full_name)};flex-shrink:0"></div>
          <div class="patient-mobile-card-info">
            <div class="patient-mobile-card-name"></div>
            <div class="patient-mobile-card-meta"></div>
            <div class="patient-mobile-card-footer">
              ${statusBadge(p.status)}
              <button class="btn-whatsapp btn-sm card-wa-btn" style="margin-right:auto">💬</button>
            </div>
          </div>`;
        card.querySelector('.avatar').textContent = initials(p.full_name);
        card.querySelector('.patient-mobile-card-name').textContent = p.full_name;
        const meta = [p.phone, p.treatment_type, age ? `גיל ${age}` : ''].filter(Boolean).join(' · ');
        card.querySelector('.patient-mobile-card-meta').textContent = meta;
        card.addEventListener('click', (e) => { if (e.target.closest('button')) return; window.location.href = `/patient.html?id=${p.id}`; });
        card.querySelector('.card-wa-btn').addEventListener('click', () => openWhatsApp(p.phone || ''));
        container.appendChild(card);
      });
    }

    function scheduleAppt(patientId, name) {
      window.location.href = `/calendar.html`;
    }

    async function archivePatient(id, current) {
      const newStatus = current === 'active' ? 'archived' : 'active';
      try {
        await updatePatient(id, { status: newStatus });
        showToast(newStatus === 'archived' ? 'מטופל הועבר לארכיון' : 'מטופל שוחזר', 'success');
        await loadPatients();
      } catch { showToast('שגיאה בעדכון', 'error'); }
    }

    function setupSave() {
      document.getElementById('save-patient-btn').addEventListener('click', async () => {
        if (!therapistId) { showToast('פרופיל מטפל לא נמצא. נסי לרענן את הדף.', 'error'); return; }
        const name = document.getElementById('p-name').value.trim().slice(0, 120);
        if (!name) { showToast('שם מלא הוא שדה חובה', 'error'); return; }

        const phone = document.getElementById('p-phone').value.trim().slice(0, 30);
        const email = document.getElementById('p-email').value.trim().slice(0, 200);
        const notes = document.getElementById('p-notes').value.trim().slice(0, 3000);

        const btn = document.getElementById('save-patient-btn');
        btn.disabled = true; btn.textContent = 'שומר...';

        try {
          const patient = await createPatient({
            therapist_id: therapistId,
            full_name: name,
            phone,
            email,
            birth_date: document.getElementById('p-birth').value || null,
            treatment_type: document.getElementById('p-treatment').value,
            notes,
            status: 'active'
          });
          showToast('מטופל נוסף בהצלחה! 🎉', 'success');
          closeModal('modal-new-patient');
          document.getElementById('p-name').value = '';
          document.getElementById('p-phone').value = '';
          document.getElementById('p-email').value = '';
          document.getElementById('p-birth').value = '';
          document.getElementById('p-treatment').value = '';
          document.getElementById('p-notes').value = '';
          await loadPatients();
          window.location.href = `/patient.html?id=${patient.id}`;
        } catch (err) {
          showToast('שגיאה בשמירה: ' + err.message, 'error');
        } finally {
          btn.disabled = false; btn.textContent = 'שמירה';
        }
      });
    }

    init();
  </script>

  <datalist id="treatment-types">
    <option>טיפול פרטני</option>
    <option>טיפול זוגי</option>
    <option>טיפול משפחתי</option>
    <option>טיפול קבוצתי</option>
    <option>CBT</option>
    <option>EMDR</option>
    <option>DBT</option>
    <option>ACT</option>
    <option>פסיכודינמי</option>
    <option>הדרכת הורים</option>
    <option>טיפול בחרדה</option>
    <option>טיפול בטראומה</option>
    <option>פגישת אינטייק</option>
    <option>מעקב</option>
    <option>פיזיותרפיה</option>
    <option>נטורופתיה</option>
    <option>רפלקסולוגיה</option>
    <option>דיקור סיני</option>
  </datalist>
</body>
</html>
